name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java setup ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build & test ──────────────────────────────────────────────────────
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      # ── 4. Upload JAR artifact ───────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharding-replication-jar
          path: target/*.jar
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Checkstyle ───────────────────────────────────────────────────────────
      - name: Run Checkstyle
        run: mvn --batch-mode --no-transfer-progress checkstyle:check
        continue-on-error: true

      # ── Dependency vulnerability scan ────────────────────────────────────────
      - name: Check for dependency updates
        run: mvn --batch-mode --no-transfer-progress versions:display-dependency-updates
        continue-on-error: true
